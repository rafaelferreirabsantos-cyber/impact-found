name: Testes e integridade

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-validation.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-validation.txt
      - name: Conferir dependências
        run: python -m pip check
      - name: Testes unitários sem coleta de mercado
        run: python -m unittest discover -s tests -v
      - name: Conferir repositório
        run: python scripts/check_repository.py
      - name: Conferir sintaxe
        run: python -m compileall -q src scripts tests
