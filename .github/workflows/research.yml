name: Conferência da amostra congelada

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-validation.txt
      - run: python -m pip install -r requirements-validation.txt
      - name: Restaurar exatamente os assets publicados
        run: python scripts/research_data.py --download-research
      - name: Conferir cálculos reais e preservação da etapa 1
        run: python tests/validate_stage2_real.py

